<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
<title id="title">Падение напряжения на двух жилах кабеля</title><desc id="desc">Принципиальная схема бумажной модели постоянного тока. Идеальный источник 12 вольт питает нагрузку 5,65 ома через две жилы сопротивлением по 0,175 ома. Ток 2 ампера, нагрузка 11,3 вольта. Не инструкция для сборки.</desc>
<rect width="1200" height="810" fill="white"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563a6"/></marker><marker id="heat" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#c47a32"/></marker><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#f3e9d9"/><path d="M0 0 V16" stroke="#decdb5" stroke-width="4"/></pattern></defs>
<g font-family="DejaVu Sans, sans-serif">
<text x="40" y="57" font-size="38" fill="#192b3f" font-weight="bold">Длина маршрута и полный путь тока</text>
<text x="40" y="96" font-size="22" fill="#506177">Принципиальная схема только для расчёта. Это не батарейный стенд курса.</text>
<rect x="40" y="126" width="1120" height="66" rx="14" fill="#edf4fb"/>
<text x="60" y="154" font-size="22" fill="#192b3f">Каждая жила: L = 10 м; S = 1 мм²; задано ρ₂₀ = 0,0175 Ом·мм²/м.</text>
<text x="60" y="181" font-size="21" fill="#506177">Rжилы = ρ × L / S = 0,175 Ом. Контакты и остальные проводники идеальны.</text>
<path d="M160 340 V260 H415" stroke="#192b3f" stroke-width="4" fill="none"/>
<rect x="415" y="237" width="190" height="46" rx="0" fill="white" stroke="#192b3f" stroke-width="2"/>
<path d="M605 260 H1010 V340" stroke="#192b3f" stroke-width="4" fill="none"/>
<rect x="987" y="340" width="46" height="155" rx="0" fill="white" stroke="#192b3f" stroke-width="2"/>
<path d="M1010 495 V570 H605" stroke="#192b3f" stroke-width="4" fill="none"/>
<rect x="415" y="547" width="190" height="46" rx="0" fill="white" stroke="#192b3f" stroke-width="2"/>
<path d="M415 570 H160 V440" stroke="#192b3f" stroke-width="4" fill="none"/>
<circle cx="160" cy="390" r="50" fill="white" stroke="#192b3f" stroke-width="4"/>
<text x="160" y="380" font-size="30" fill="#192b3f" text-anchor="middle">+</text>
<text x="160" y="420" font-size="34" fill="#192b3f" text-anchor="middle">−</text>
<text x="236" y="366" font-size="26" fill="#192b3f" font-weight="bold">12 В DC</text>
<text x="236" y="400" font-size="19" fill="#506177">идеальный</text>
<text x="236" y="427" font-size="19" fill="#506177">источник</text>
<text x="510" y="226" font-size="23" fill="#192b3f" text-anchor="middle">Исходящая жила: 0,175 Ом</text>
<text x="510" y="629" font-size="23" fill="#192b3f" text-anchor="middle">Обратная жила: 0,175 Ом</text>
<text x="900" y="370" font-size="24" fill="#192b3f" font-weight="bold" text-anchor="end">Нагрузка</text>
<text x="900" y="408" font-size="25" fill="#192b3f" text-anchor="end">R = 5,65 Ом</text>
<text x="900" y="450" font-size="25" fill="#2563a6" font-weight="bold" text-anchor="end">U = 11,3 В</text>
<line x1="695" y1="239" x2="865" y2="239" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="783" y="227" font-size="24" fill="#2563a6" text-anchor="middle">I = 2 А</text>
<line x1="865" y1="591" x2="695" y2="591" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="780" y="622" font-size="24" fill="#2563a6" text-anchor="middle">I = 2 А</text>
<rect x="40" y="659" width="1120" height="113" rx="14" fill="#edf4fb"/>
<text x="62" y="697" font-size="27" fill="#192b3f" font-weight="bold">Rпетли = 2 × 0,175 = 0,35 Ом     →     ΔU = 2 × 0,35 = 0,70 В</text>
<text x="62" y="734" font-size="25" fill="#192b3f">Потери в двух жилах: P = I²Rпетли = 2² × 0,35 = 1,40 Вт.</text>
<text x="62" y="762" font-size="20" fill="#506177">Суммарная длина металла в рабочем контуре — 20 м. Допустимый ток здесь не определяется.</text>
</g></svg>
