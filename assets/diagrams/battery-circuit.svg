<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">Батарейная цепь: источник, выключатель, резистор</title>
  <desc id="desc">Учебная принципиальная схема. Два элемента AA, примерно три вольта, последовательно соединены с разомкнутым выключателем S1 и резистором R1 один килоом. При разомкнутом выключателе ток равен нулю. При замыкании идеальная модель даёт около трёх миллиампер. Соединения с сетью нет.</desc>
  <rect width="1280" height="680" rx="24" fill="#f4f7fa"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="58" y="58" fill="#14756b" font-size="18" font-weight="700" letter-spacing="2">ДОМАШНЯЯ ЭЛЕКТРИКА · УЧЕБНАЯ СХЕМА</text>
    <text x="58" y="108" fill="#142d42" font-size="32" font-weight="700">Ток возможен, когда цепь замкнута</text>
    <text x="58" y="143" fill="#536476" font-size="19">Источник → выключатель → нагрузка → обратно к источнику</text>

    <rect x="58" y="180" width="1164" height="350" rx="18" fill="#fff" stroke="#dce5ed" stroke-width="2"/>
    <g stroke="#24465e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 306 V250 H485"/>
      <path d="M570 250 H760"/>
      <path d="M895 250 H1040 V450 H250 V384"/>
      <path d="M250 332 V358"/>
      <path d="M205 306 H295 M225 332 H275 M205 358 H295 M225 384 H275"/>
      <path d="M485 250 L551 209"/>
      <circle cx="485" cy="250" r="6" fill="#fff"/>
      <circle cx="570" cy="250" r="6" fill="#fff"/>
      <rect x="760" y="227" width="135" height="46" fill="#e0f2ed"/>
    </g>
    <text x="187" y="292" font-size="24" font-weight="700" fill="#14756b">+</text>
    <text x="189" y="409" font-size="24" font-weight="700" fill="#536476">−</text>
    <text x="330" y="334" fill="#142d42" font-size="23" font-weight="700">2 × AA</text>
    <text x="330" y="365" fill="#536476" font-size="20">U ≈ 3 В</text>
    <text x="487" y="303" fill="#142d42" font-size="22" font-weight="700">S1</text>
    <text x="487" y="332" fill="#536476" font-size="19">разомкнут</text>
    <text x="760" y="309" fill="#142d42" font-size="22" font-weight="700">R1 = 1 кОм</text>
    <text x="760" y="339" fill="#536476" font-size="19">нагрузка</text>
    <text x="636" y="493" text-anchor="middle" fill="#536476" font-size="18">Линии — проводники. Разрыв у S1 сейчас прерывает путь тока.</text>

    <rect x="58" y="550" width="559" height="76" rx="12" fill="#e4edf4"/>
    <text x="82" y="581" fill="#142d42" font-size="20" font-weight="700">S1 разомкнут: I = 0</text>
    <text x="82" y="608" fill="#536476" font-size="17">Напряжение батарей при этом сохраняется.</text>
    <rect x="637" y="550" width="585" height="76" rx="12" fill="#e0f2ed"/>
    <text x="660" y="581" fill="#142d42" font-size="20" font-weight="700">S1 замкнут: I ≈ U / R ≈ 3 мА</text>
    <text x="660" y="608" fill="#536476" font-size="17">Идеальная модель; реальное значение измеряют.</text>
    <text x="58" y="656" fill="#536476" font-size="17">Без связи с сетью 230 В. Условия сборки и защиты источника — в главе 04.</text>
  </g>
</svg>
