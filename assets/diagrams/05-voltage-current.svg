<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1375" viewBox="0 0 1200 1375" role="img" aria-labelledby="title desc">
<title id="title">Напряжение измеряют параллельно, ток — последовательно</title>
<desc id="desc">Две отдельные принципиальные схемы одного учебного стенда. В каждой B1 — два щелочных AA, условно 3 В; штатный S1 замкнут; постоянный R0 1 кОм закрыт у источника. В верхней схеме R1 1 кОм подключён между P и M, вольтметр подключён параллельно R1: красный вход V/Ω к P, чёрный COM к M. Расчётное напряжение 1,5 В. В нижней схеме цепь P — токовый вход mA — амперметр — COM — R1 — M; расчётный ток идеального амперметра 1,5 мА. Действие реальных приборов на цепь не включено в эти числа; переключатель держателя условно изображён в плюсе. M не является N или PE. Неправильного подключения амперметра поперёк источника здесь нет.</desc>
<rect width="1200" height="1375" fill="#ffffff"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="48" y="51" font-size="19" fill="#14756b" font-weight="700" text-anchor="start">ГЛАВА 05 · ПРИНЦИПИАЛЬНЫЕ СХЕМЫ</text>
<text x="48" y="104" font-size="34" fill="#142d42" font-weight="700" text-anchor="start">Напряжение и ток: разные включения</text>
<text x="48" y="146" font-size="21" fill="#536476" font-weight="400" text-anchor="start">На обеих схемах постоянный R0 остаётся между батареями и доступным выходом P.</text>
<rect x="48" y="190" width="1104" height="490" rx="16" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2"/>
<text x="74" y="231" font-size="27" fill="#142d42" font-weight="700" text-anchor="start">1 · Напряжение: между P и M</text>
<text x="74" y="268" font-size="21" fill="#536476" font-weight="400" text-anchor="start">Режим V DC. Красный щуп — V/Ω; чёрный — COM.</text>
<rect x="74" y="295" width="580" height="315" rx="16" fill="#ffffff" stroke="#91a7b8" stroke-width="2" stroke-dasharray="8 7"/>
