<text x="300" y="933" font-size="19" fill="#536476" font-weight="400" text-anchor="middle">замкнут</text>
<rect x="424" y="879" width="116" height="36" rx="0" fill="#e0f2ed" stroke="#245c82" stroke-width="4"/>
