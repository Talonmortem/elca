<text x="350" y="651" font-size="22" fill="#142d42" font-weight="400" text-anchor="start">Вольтметр подключён параллельно R1.</text>
<rect x="48" y="704" width="1104" height="490" rx="16" fill="#edf8f5" stroke="#b9dcd2" stroke-width="2"/>
