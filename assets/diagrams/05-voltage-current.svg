<text x="74" y="1165" font-size="25" fill="#14756b" font-weight="700" text-anchor="start">I ≈ 1,5 мА</text>
<text x="350" y="1165" font-size="22" fill="#142d42" font-weight="400" text-anchor="start">Весь ток R1 проходит через амперметр.</text>
<text x="48" y="1240" font-size="20" fill="#536476" font-weight="400" text-anchor="start">Обе схемы принципиальные. S1 показан условно в плюсе; его место не меняют.</text>
<text x="48" y="1274" font-size="20" fill="#536476" font-weight="400" text-anchor="start">Расчёт: B1 = 3 В; R0 = R1 = 1 кОм; провода и приборы считаются идеальными.</text>
<text x="48" y="1308" font-size="20" fill="#536476" font-weight="400" text-anchor="start">Реальный вольтметр нагружает цепь; амперметр добавляет сопротивление.</text>
<text x="48" y="1345" font-size="21" fill="#14756b" font-weight="700" text-anchor="start">Перед изменением схемы вынуть AA. M — возврат стенда, не N и не PE.</text>
</g>
</svg>
