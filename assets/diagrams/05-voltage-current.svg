<text x="215" y="982" font-size="23" fill="#142d42" font-weight="700" text-anchor="start">B1: 2 × AA</text>
<text x="215" y="1016" font-size="20" fill="#536476" font-weight="400" text-anchor="start">3 В (условно)</text>
