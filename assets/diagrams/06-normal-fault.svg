<circle cx="180" cy="568" r="6" fill="#245c82" stroke="none" stroke-width="3"/>
<circle cx="735" cy="568" r="7" fill="#14756b" stroke="none" stroke-width="3"/>
<text x="590" y="310" font-size="23" fill="#142d42" font-weight="700" text-anchor="start">L</text>
<text x="590" y="500" font-size="23" fill="#245c82" font-weight="700" text-anchor="start">N</text>
<text x="590" y="554" font-size="23" fill="#14756b" font-weight="700" text-anchor="start">PE</text>
<text x="240" y="631" font-size="20" fill="#536476" font-weight="400" text-anchor="start">Заземлённая нейтраль источника</text>
<text x="240" y="662" font-size="18" fill="#536476" font-weight="400" text-anchor="start">Здесь N и PE связаны; у нагрузки — раздельны.</text>
<path d="M530 280 H655" fill="none" stroke="#b46a19" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/>
<path d="M655 472 H530" fill="none" stroke="#b46a19" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/>
<path d="M144 450.0 V388.0" fill="none" stroke="#b46a19" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/>
<text x="76" y="720" font-size="21" fill="#142d42" font-weight="700" text-anchor="start">L → нагрузка → N → источник → L. PE не служит рабочим обратным проводом.</text>
<text x="76" y="753" font-size="20" fill="#536476" font-weight="400" text-anchor="start">В этой модели малыми токами утечки и сопротивлением проводников пренебрегаем.</text>
<rect x="48" y="798" width="1184" height="584" rx="14" fill="#fff8f7" stroke="#dce5ed" stroke-width="2"/>
<text x="76" y="840" font-size="26" fill="#b33636" font-weight="700" text-anchor="start">2 · Повреждение L на корпус</text>
<rect x="735" y="894" width="389" height="326" rx="0" fill="white" stroke="#879aa9" stroke-width="4"/>
<text x="931" y="925" font-size="20" fill="#536476" font-weight="400" text-anchor="middle">Металлический корпус</text>
