<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1530" viewBox="0 0 1280 1530" role="img" aria-labelledby="title desc">
<title id="title">Рабочая цепь и путь тока при повреждении изоляции в TN-S</title>
<desc id="desc">Две упрощённые принципиальные схемы однофазного фрагмента TN-S с источником 230 В переменного тока 50 Гц и заземлённой нейтралью. В исправной схеме рабочий ток замыкается через L, условный автомат QF, резистивную нагрузку и N. PE соединяет корпус с нейтралью источника; у нагрузки N и PE не объединены. Во второй схеме повреждение L на корпус создаёт отдельный путь по PE к нейтрали источника и через источник обратно в L. Стрелки показывают условное направление в один полупериод. Импедансы и время отключения не рассчитаны; УЗО и другие аппараты не показаны. Схемы не предназначены для монтажа или искусственного создания повреждения.</desc>
<defs>
<marker id="arr-wire" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#245c82"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#14756b"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b33636"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b46a19"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#536476"/></marker>
</defs>
<rect width="1280" height="1530" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="48" y="50" font-size="18" fill="#14756b" font-weight="700" text-anchor="start">ГЛАВА 06 · УПРОЩЁННЫЕ ПРИНЦИПИАЛЬНЫЕ СХЕМЫ</text>
<text x="48" y="104" font-size="33" fill="#142d42" font-weight="700" text-anchor="start">Рабочий ток и ток повреждения</text>
<text x="48" y="145" font-size="21" fill="#536476" font-weight="400" text-anchor="start">Однофазный фрагмент TN-S: источник 230 В ~, 50 Гц; металлический корпус прибора класса I.</text>
<rect x="48" y="186" width="1184" height="584" rx="14" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2"/>
<text x="76" y="228" font-size="26" fill="#142d42" font-weight="700" text-anchor="start">1 · Исправная изоляция</text>
<rect x="735" y="282" width="389" height="326" rx="0" fill="white" stroke="#879aa9" stroke-width="4"/>
<text x="931" y="313" font-size="20" fill="#536476" font-weight="400" text-anchor="middle">Металлический корпус</text>
<path d="M735 315 V333 M735 505 V523" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 324 V381.0 M180 457.0 V514" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="180" cy="419.0" r="38" fill="white" stroke="#245c82" stroke-width="3"/>
<text x="180" y="429.0" font-size="36" fill="#245c82" font-weight="400" text-anchor="middle">~</text>
<text x="180" y="277" font-size="20" fill="#536476" font-weight="400" text-anchor="middle">Источник</text>
<text x="76" y="480" font-size="21" fill="#142d42" font-weight="700" text-anchor="start">230 В ~</text>
<path d="M180 324 H438 M498 324 H900 V384" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="438" cy="324" r="5" fill="white" stroke="#245c82" stroke-width="3"/>
<circle cx="498" cy="324" r="5" fill="white" stroke="#245c82" stroke-width="3"/>
