<path d="M180 936 V993.0 M180 1069.0 V1126" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="180" cy="1031.0" r="38" fill="white" stroke="#245c82" stroke-width="3"/>
<text x="180" y="1041.0" font-size="36" fill="#245c82" font-weight="400" text-anchor="middle">~</text>
<text x="180" y="889" font-size="20" fill="#536476" font-weight="400" text-anchor="middle">Источник</text>
<text x="76" y="1092" font-size="21" fill="#142d42" font-weight="700" text-anchor="start">230 В ~</text>
<path d="M180 936 H438 M498 936 H900 V996" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="438" cy="936" r="5" fill="white" stroke="#245c82" stroke-width="3"/>
<circle cx="498" cy="936" r="5" fill="white" stroke="#245c82" stroke-width="3"/>
<path d="M438 936 H498" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="468" y="911" font-size="22" fill="#142d42" font-weight="700" text-anchor="middle">QF</text>
<text x="468" y="975" font-size="17" fill="#536476" font-weight="400" text-anchor="middle">условный автомат</text>
<rect x="880" y="996" width="40" height="90" rx="0" fill="#e0f2ed" stroke="#245c82" stroke-width="3"/>
<text x="851" y="1032" font-size="23" fill="#142d42" font-weight="700" text-anchor="end">R</text>
<text x="851" y="1067" font-size="19" fill="#536476" font-weight="400" text-anchor="end">нагрузка</text>
<path d="M900 1086 V1126 H180" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 1126 V1220" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 1220 v20 M155 1240 h50 M163 1251 h34 M172 1262 h16" fill="none" stroke="#245c82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 1180 H735" fill="none" stroke="#14756b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 1180 H735" fill="none" stroke="#f0c54a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/>
<circle cx="180" cy="1126" r="6" fill="#245c82" stroke="none" stroke-width="3"/>
<circle cx="180" cy="1180" r="6" fill="#245c82" stroke="none" stroke-width="3"/>
<circle cx="735" cy="1180" r="7" fill="#14756b" stroke="none" stroke-width="3"/>
<text x="590" y="922" font-size="23" fill="#142d42" font-weight="700" text-anchor="start">L</text>
<text x="590" y="1112" font-size="23" fill="#245c82" font-weight="700" text-anchor="start">N</text>
<text x="590" y="1166" font-size="23" fill="#14756b" font-weight="700" text-anchor="start">PE</text>
<text x="240" y="1243" font-size="20" fill="#536476" font-weight="400" text-anchor="start">Заземлённая нейтраль источника</text>
<text x="240" y="1274" font-size="18" fill="#536476" font-weight="400" text-anchor="start">Здесь N и PE связаны; у нагрузки — раздельны.</text>
<path d="M900 936 H1040 V1044 H1060" fill="none" stroke="#b33636" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1060 1044 l10 -10 l12 20 l12 -20 l12 20 l12 -10 H1124" fill="none" stroke="#b33636" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="900" cy="936" r="6" fill="#b33636" stroke="none" stroke-width="3"/>
<circle cx="1124" cy="1044" r="7" fill="#b33636" stroke="none" stroke-width="3"/>
<text x="1038" y="1077" font-size="18" fill="#b33636" font-weight="700" text-anchor="middle">пробой</text>
<text x="1038" y="1102" font-size="18" fill="#b33636" font-weight="700" text-anchor="middle">изоляции</text>
<path d="M1124 1044 V1220 H735 V1180 H180 V1126" fill="none" stroke="#b33636" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/>
<path d="M530 892 H655" fill="none" stroke="#b33636" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/>
<path d="M580 1200 H455" fill="none" stroke="#b33636" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/>
<path d="M144 1062.0 V1000.0" fill="none" stroke="#b33636" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/>
<text x="76" y="1332" font-size="21" fill="#b33636" font-weight="700" text-anchor="start">L → повреждение → корпус → PE → нейтраль источника → источник → L</text>
<text x="76" y="1365" font-size="20" fill="#536476" font-weight="400" text-anchor="start">Отключение зависит от тока, полного сопротивления петли и выбранной защиты.</text>
<text x="48" y="1426" font-size="20" fill="#536476" font-weight="400" text-anchor="start">Стрелки — условное направление тока в один полупериод; через полпериода оно меняется.</text>
<text x="48" y="1463" font-size="20" fill="#536476" font-weight="400" text-anchor="start">УЗО и другие аппараты опущены. Номинал нагрузки, защита и время отключения не рассчитаны.</text>
<text x="48" y="1500" font-size="23" fill="#142d42" font-weight="700" text-anchor="start">Это учебные схемы, а не инструкция монтажа или проверки замыканием.</text>
