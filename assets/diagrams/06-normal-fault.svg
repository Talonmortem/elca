<text x="468" y="299" font-size="22" fill="#142d42" font-weight="700" text-anchor="middle">QF</text>
<text x="468" y="363" font-size="17" fill="#536476" font-weight="400" text-anchor="middle">условный автомат</text>
<rect x="880" y="384" width="40" height="90" rx="0" fill="#e0f2ed" stroke="#245c82" stroke-width="3"/>
<text x="851" y="420" font-size="23" fill="#142d42" font-weight="700" text-anchor="end">R</text>
<text x="851" y="455" font-size="19" fill="#536476" font-weight="400" text-anchor="end">нагрузка</text>
<path d="M900 474 V514 H180" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 514 V608" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 608 v20 M155 628 h50 M163 639 h34 M172 650 h16" fill="none" stroke="#245c82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 568 H735" fill="none" stroke="#14756b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 568 H735" fill="none" stroke="#f0c54a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/>
