<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc">
<title id="title">Условные обозначения: соединение, пересечение и электрический узел</title>
<desc id="desc">Учебная легенда главы 07. Источник из двух AA показан двумя парами длинной и короткой пластин, длинная сторона положительна. Прямоугольник обозначает резистор, разомкнутый контакт — выключатель, круг с крестом — лампу. Точка на пересечении объединяет четыре направления в один узел. При пересечении с мостиком провода A–B и C–D не соединены. Изгиб провода не создаёт нового узла, а резистор между двумя проводами отделяет узлы A и B.</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#14756b"/></marker></defs>
<rect width="1200" height="1130" fill="#ffffff"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="48" y="48" font-size="19" fill="#14756b" font-weight="700" text-anchor="start" >ГЛАВА 07 · УЧЕБНАЯ ЛЕГЕНДА</text>
<text x="48" y="98" font-size="34" fill="#142d42" font-weight="700" text-anchor="start" >Соединение важнее формы рисунка</text>
<text x="48" y="139" font-size="21" fill="#536476" font-weight="400" text-anchor="start" >Сначала читай обозначения и узлы. Цвет лишь помогает различать линии.</text>
<rect x="48" y="180" width="258" height="245" rx="14" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2" />
<text x="177" y="218" font-size="22" fill="#142d42" font-weight="700" text-anchor="middle" >Источник B1</text>
<rect x="330" y="180" width="258" height="245" rx="14" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2" />
<text x="459" y="218" font-size="22" fill="#142d42" font-weight="700" text-anchor="middle" >Резистор R1</text>
<rect x="612" y="180" width="258" height="245" rx="14" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2" />
<text x="741" y="218" font-size="22" fill="#142d42" font-weight="700" text-anchor="middle" >Выключатель S1</text>
<rect x="894" y="180" width="258" height="245" rx="14" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2" />
<text x="1023" y="218" font-size="22" fill="#142d42" font-weight="700" text-anchor="middle" >Лампа E1</text>
<path d="M93 294 H134 M155 294 H186 M207 294 H256" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M134 258 V330 M155 274 V314 M186 258 V330 M207 274 V314" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<text x="101" y="258" font-size="26" fill="#14756b" font-weight="700" text-anchor="middle" >+</text>
<text x="240" y="258" font-size="26" fill="#536476" font-weight="700" text-anchor="middle" >−</text>
<text x="177" y="365" font-size="23" fill="#142d42" font-weight="700" text-anchor="middle" >2 × AA</text>
<text x="177" y="397" font-size="19" fill="#536476" font-weight="400" text-anchor="middle" >3 В номинально</text>
<path d="M363 294 H402 M516 294 H555" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<rect x="402" y="273" width="114" height="42" rx="0" fill="#edf8f5" stroke="#245c82" stroke-width="4" />
<text x="459" y="365" font-size="23" fill="#142d42" font-weight="700" text-anchor="middle" >R1 = 1 кОм</text>
<text x="459" y="397" font-size="18" fill="#536476" font-weight="400" text-anchor="middle" >Значение — в подписи</text>
<path d="M646 294 H693 M777 294 H836 M693 294 L762 258" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="693" cy="294" r="6" fill="#fff" stroke="#245c82" stroke-width="3"/>
<circle cx="777" cy="294" r="6" fill="#fff" stroke="#245c82" stroke-width="3"/>
<text x="741" y="365" font-size="23" fill="#142d42" font-weight="700" text-anchor="middle" >Разомкнут</text>
<text x="741" y="397" font-size="18" fill="#536476" font-weight="400" text-anchor="middle" >Зазор разрывает путь</text>
<path d="M925 294 H987 M1059 294 H1120" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="1023" cy="294" r="36" fill="#fff" stroke="#245c82" stroke-width="4"/>
<path d="M998 269 L1048 319 M998 319 L1048 269" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<text x="1023" y="365" font-size="23" fill="#142d42" font-weight="700" text-anchor="middle" >Символ лампы</text>
<text x="1023" y="397" font-size="18" fill="#536476" font-weight="400" text-anchor="middle" >Не фото устройства</text>
<rect x="48" y="457" width="540" height="283" rx="14" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2" />
<rect x="612" y="457" width="540" height="283" rx="14" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2" />
<text x="72" y="498" font-size="25" fill="#142d42" font-weight="700" text-anchor="start" >Соединение: точка</text>
<path d="M167 600 H462 M315 552 V653" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="315" cy="600" r="9" fill="#245c82" stroke="none" stroke-width="0"/>
<text x="141" y="608" font-size="24" fill="#14756b" font-weight="700" text-anchor="middle" >A</text>
<text x="488" y="608" font-size="24" fill="#14756b" font-weight="700" text-anchor="middle" >B</text>
<text x="315" y="542" font-size="24" fill="#14756b" font-weight="700" text-anchor="middle" >C</text>
<text x="315" y="684" font-size="24" fill="#14756b" font-weight="700" text-anchor="middle" >D</text>
<text x="318" y="718" font-size="21" fill="#536476" font-weight="400" text-anchor="middle" >A, B, C и D — один узел</text>
<text x="636" y="498" font-size="25" fill="#142d42" font-weight="700" text-anchor="start" >Пересечение: связи нет</text>
<path d="M881 552 V653" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M860 600 A21 21 0 0 1 902 600" fill="none" stroke="#f7f9fb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
<path d="M733 600 H860 A21 21 0 0 1 902 600 H1029" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<text x="707" y="608" font-size="24" fill="#14756b" font-weight="700" text-anchor="middle" >A</text>
<text x="1055" y="608" font-size="24" fill="#14756b" font-weight="700" text-anchor="middle" >B</text>
<text x="881" y="542" font-size="24" fill="#14756b" font-weight="700" text-anchor="middle" >C</text>
<text x="881" y="684" font-size="24" fill="#14756b" font-weight="700" text-anchor="middle" >D</text>
<text x="882" y="718" font-size="20" fill="#536476" font-weight="400" text-anchor="middle" >A–B — один провод; C–D — другой</text>
<rect x="48" y="772" width="540" height="271" rx="14" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2" />
<rect x="612" y="772" width="540" height="271" rx="14" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2" />
<text x="72" y="815" font-size="24" fill="#142d42" font-weight="700" text-anchor="start" >Изгиб не создаёт новый узел</text>
<path d="M112 898 H198 V948 H346 V873 H493" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="112" cy="898" r="7" fill="#245c82" stroke="none" stroke-width="0"/>
<circle cx="493" cy="873" r="7" fill="#245c82" stroke="none" stroke-width="0"/>
<text x="112" y="871" font-size="25" fill="#14756b" font-weight="700" text-anchor="middle" >A</text>
<text x="493" y="846" font-size="25" fill="#14756b" font-weight="700" text-anchor="middle" >A</text>
<text x="318" y="1010" font-size="20" fill="#536476" font-weight="400" text-anchor="middle" >Весь непрерывный провод — узел A</text>
<text x="636" y="815" font-size="24" fill="#142d42" font-weight="700" text-anchor="start" >Резистор между двумя узлами</text>
<path d="M680 909 H816 M947 909 H1085" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<rect x="816" y="886" width="131" height="46" rx="0" fill="#edf8f5" stroke="#245c82" stroke-width="4" />
<circle cx="705" cy="909" r="7" fill="#245c82" stroke="none" stroke-width="0"/>
<circle cx="1060" cy="909" r="7" fill="#245c82" stroke="none" stroke-width="0"/>
<text x="705" y="873" font-size="25" fill="#14756b" font-weight="700" text-anchor="middle" >A</text>
<text x="1060" y="873" font-size="25" fill="#14756b" font-weight="700" text-anchor="middle" >B</text>
<text x="881" y="865" font-size="23" fill="#142d42" font-weight="700" text-anchor="middle" >R</text>
<text x="882" y="1010" font-size="20" fill="#536476" font-weight="400" text-anchor="middle" >A и B не являются одним узлом</text>
<text x="48" y="1093" font-size="20" fill="#536476" font-weight="400" text-anchor="start" >В другой документации проверь легенду: оформление пересечений может отличаться.</text>
</g>
</svg>
