<text x="862" y="589" font-size="22">X4, X5</text>
<rect x="846" y="637" width="278" height="98" rx="10" fill="#f3edf9" stroke="#7952a3" stroke-width="1.5"/>
<text x="862" y="669" font-size="20" font-weight="700" style="fill:#7952a3">G4 · Точка ПММ</text>
<text x="862" y="704" font-size="22">X6</text>
<text x="852" y="783" font-size="19" style="fill:#566b80">ПММ — посудомоечная</text>
<text x="852" y="809" font-size="19" style="fill:#566b80">машина (условие задачи).</text>
<text x="80" y="829" font-size="22">E — световая точка; X — розеточная точка. Значки плана условные.</text>
<text x="80" y="872" font-size="22" style="fill:#566b80">Цвет и имя G обозначают группу. Линий прокладки кабеля здесь нет.</text>
<rect x="48" y="940" width="1104" height="455" rx="14" fill="#f6f9fc" stroke="#d9e5ef" stroke-width="2"/>
<text x="72" y="982" font-size="27" font-weight="700">Б. Как точки распределены по группам</text>
