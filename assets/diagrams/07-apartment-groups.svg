<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1490" viewBox="0 0 1200 1490" role="img" aria-labelledby="title desc">
<title id="title">Учебная квартира: расположение точек и четыре электрические группы</title>
<desc id="desc">Вымышленная квартира. G1 QF1 питает E1 E2 E3 E4 в четырёх помещениях. G2 QF2 питает X1 X2 в гостиной и X3 в спальне. G3 QF3 питает кухонные X4 X5. G4 QF4 питает X6 для посудомоечной машины. План не показывает трассы. Нижняя часть — функциональный однолинейный обзор с условными блоками автоматов; отдельные проводники, полюса, шины и общая защита не показаны.</desc>
<style>
text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183449}
.muted{fill:#566b80}.head{font-weight:700}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="1200" height="1490" fill="#fff"/>

<text x="48" y="48" font-size="20" font-weight="700" style="fill:#087d73">ГЛАВА 07 · ПЛАН И ФУНКЦИОНАЛЬНЫЙ ОБЗОР</text>
<text x="48" y="98" font-size="33" font-weight="700">Комната и электрическая группа — разные связи</text>
<text x="48" y="140" font-size="23" style="fill:#566b80">Вымышленный пример: 230 В ~ 50 Гц. Масштаб и трассы не заданы.</text>
