<text x="1005" y="1309" font-size="20" style="fill:#566b80" text-anchor="middle">Точка ПММ</text>
<text x="72" y="1359" font-size="21" style="fill:#566b80">QF — условный блок группового автомата. Линия показывает связь группы.</text>
<text x="48" y="1432" font-size="21" style="fill:#566b80">Проводники L/N/PE, полюса, шины, вводная и дифференциальная защита не раскрыты.</text>
<text x="48" y="1468" font-size="21" style="fill:#566b80">Это учебная карта зависимостей. Номиналы, сечения и монтаж по ней не выбирают.</text>
