<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" role="img" aria-labelledby="title desc">
  <title id="title">Обрыв и короткое замыкание с учётом внутреннего сопротивления источника</title>
  <desc id="desc">Две учебные принципиальные схемы, не инструкция опыта. Батарея моделируется идеальным источником U0 3 В и последовательным положительным внутренним сопротивлением rвн. Сверху разрыв в проводнике прерывает единственный путь: ток равен нулю, напряжение на резисторе R1 1 кОм равно нулю, на разрыве 3 В. Снизу красный идеальный провод замыкает оба вывода R1: напряжение на R1 и ток через него равны нулю, ток короткого замыкания проходит через шунт и ограничен rвн. Формула IКЗ = U0/rвн относится только к этой модели идеального шунта и проводов. Значение rвн не задано, численный ток неизвестен. В реальности на ток и остаточное напряжение влияют провода и соединения. Не собирать и не воспроизводить короткое замыкание.</desc>
  <defs>
    <marker id="current" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#14756b"/></marker>
    <marker id="fault" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#b43c31"/></marker>
  </defs>
  <rect width="1280" height="1100" fill="white"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
<text x="58" y="53" font-size="17" fill="#14756b" font-weight="700" text-anchor="start">ГЛАВА 02 · УЧЕБНАЯ ПРИНЦИПИАЛЬНАЯ СХЕМА</text>
<text x="58" y="107" font-size="31" fill="#142d42" font-weight="700" text-anchor="start">Обрыв и короткое замыкание — разные неисправности</text>
<text x="58" y="145" font-size="19" fill="#536476" font-weight="400" text-anchor="start">Источник: идеальные U₀ = 3 В и последовательно включённое внутреннее сопротивление r_вн &gt; 0.</text>
<rect x="58" y="184" width="1164" height="334" rx="16" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2"/>
<text x="84" y="226" font-size="25" fill="#142d42" font-weight="700" text-anchor="start">Обрыв: путь прерван</text>
<path d="M180 295 H335 M425 295 H525 M610 295 H730 V350 M730 420 V460 H180" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 295 V348" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 368 V398" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 418 V460" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 348 H210 M163 368 H197 M150 398 H210 M163 418 H197" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="129" y="352" font-size="25" fill="#14756b" font-weight="700" text-anchor="start">+</text><text x="129" y="431" font-size="25" fill="#536476" font-weight="700" text-anchor="start">−</text><text x="226" y="385" font-size="22" fill="#142d42" font-weight="700" text-anchor="start">B1</text><text x="226" y="417" font-size="22" fill="#14756b" font-weight="700" text-anchor="start">U₀ = 3 В</text>
<rect x="335" y="276.0" width="90" height="38" fill="#e6eff8" stroke="#245c82" stroke-width="4"/>
<text x="380" y="267" font-size="21" fill="#142d42" font-weight="700" text-anchor="middle">r_вн &gt; 0</text>
<text x="380" y="344" font-size="17" fill="#536476" font-weight="400" text-anchor="middle">модель батареи</text>
<circle cx="525" cy="295" r="5" fill="white" stroke="#245c82" stroke-width="3"/>
<circle cx="610" cy="295" r="5" fill="white" stroke="#245c82" stroke-width="3"/>
<text x="567" y="269" font-size="20" fill="#b43c31" font-weight="700" text-anchor="middle">обрыв</text>
<rect x="707" y="350" width="46" height="70" fill="#e0f2ed" stroke="#245c82" stroke-width="4"/><text x="774" y="377" font-size="22" fill="#142d42" font-weight="700" text-anchor="start">R1</text><text x="774" y="409" font-size="21" fill="#142d42" font-weight="400" text-anchor="start">1 кОм</text>
<text x="875" y="300" font-size="26" fill="#536476" font-weight="700" text-anchor="start">I = 0</text>
<text x="875" y="348" font-size="24" fill="#142d42" font-weight="400" text-anchor="start">U_R1 = 0</text>
<text x="875" y="396" font-size="23" fill="#14756b" font-weight="700" text-anchor="start">U_разрыва = 3 В</text>
<text x="84" y="494" font-size="19" fill="#536476" font-weight="400" text-anchor="start">Напряжение сохраняется на разрыве; отсутствие тока не означает отсутствие напряжения.</text>
<rect x="58" y="542" width="1164" height="357" rx="16" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2"/>
<text x="84" y="584" font-size="25" fill="#142d42" font-weight="700" text-anchor="start">Короткое замыкание: провод обошёл нагрузку</text>
<path d="M180 657 H335 M425 657 H730 V724 M730 794 V844 H180" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 657 V727" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 747 V777" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 797 V844" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 727 H210 M163 747 H197 M150 777 H210 M163 797 H197" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="129" y="731" font-size="25" fill="#14756b" font-weight="700" text-anchor="start">+</text><text x="129" y="810" font-size="25" fill="#536476" font-weight="700" text-anchor="start">−</text><text x="226" y="765" font-size="22" fill="#142d42" font-weight="700" text-anchor="start">B1</text><text x="226" y="797" font-size="22" fill="#14756b" font-weight="700" text-anchor="start">U₀ = 3 В</text>
<rect x="335" y="638.0" width="90" height="38" fill="#e6eff8" stroke="#245c82" stroke-width="4"/>
<text x="380" y="629" font-size="21" fill="#142d42" font-weight="700" text-anchor="middle">r_вн &gt; 0</text>
<rect x="707" y="724" width="46" height="70" fill="#e0f2ed" stroke="#245c82" stroke-width="4"/><text x="774" y="751" font-size="22" fill="#142d42" font-weight="700" text-anchor="start">R1</text><text x="774" y="783" font-size="21" fill="#142d42" font-weight="400" text-anchor="start">1 кОм</text>
<path d="M590 657 V844" fill="none" stroke="#b43c31" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="590" cy="657" r="6" fill="#b43c31" stroke="#b43c31" stroke-width="3"/>
<circle cx="590" cy="844" r="6" fill="#b43c31" stroke="#b43c31" stroke-width="3"/>
<path d="M455 633 H552" fill="none" stroke="#b43c31" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fault)"/>
<text x="506" y="614" font-size="19" fill="#b43c31" font-weight="700" text-anchor="middle">I_КЗ</text>
<path d="M609 696 V737" fill="none" stroke="#b43c31" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fault)"/>
<text x="574" y="752" font-size="18" fill="#b43c31" font-weight="700" text-anchor="end">аварийный</text>
<text x="574" y="780" font-size="18" fill="#b43c31" font-weight="700" text-anchor="end">шунт</text>
<text x="875" y="660" font-size="23" fill="#142d42" font-weight="400" text-anchor="start">U_R1 = 0; I_R1 = 0</text>
<text x="875" y="707" font-size="24" fill="#b43c31" font-weight="700" text-anchor="start">I_КЗ = U₀ / r_вн</text>
<text x="875" y="751" font-size="21" fill="#536476" font-weight="400" text-anchor="start">r_вн не задано:</text>
<text x="875" y="784" font-size="21" fill="#536476" font-weight="400" text-anchor="start">число для I_КЗ</text>
<text x="875" y="817" font-size="21" fill="#536476" font-weight="400" text-anchor="start">вычислить нельзя.</text>
<text x="84" y="875" font-size="19" fill="#b43c31" font-weight="400" text-anchor="start">Красная линия — аварийное соединение с нулевым сопротивлением в этой модели.</text>
<text x="58" y="941" font-size="18" fill="#536476" font-weight="400" text-anchor="start">Здесь ток КЗ ограничен r_вн. В реальности влияют также сопротивления проводов и контактов.</text>
<text x="58" y="972" font-size="18" fill="#536476" font-weight="400" text-anchor="start">Шунт и внешние провода идеальны; при реальном КЗ остаточное напряжение может быть ненулевым.</text>
<rect x="58" y="998" width="1164" height="75" rx="12" fill="#fff0ed" stroke="#f1c8be" stroke-width="2"/>
<text x="82" y="1043" font-size="23" fill="#b43c31" font-weight="700" text-anchor="start">ТОЛЬКО БУМАЖНЫЙ РАЗБОР. НЕ СОБИРАТЬ И НЕ ПРОВЕРЯТЬ КЗ.</text>
  </g>
</svg>
