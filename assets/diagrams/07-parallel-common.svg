<text x="190" y="610" font-size="22" fill="#536476" font-weight="400" text-anchor="start" >Общий обратный участок</text>
<rect x="48" y="779" width="1104" height="250" rx="14" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2" />
<text x="72" y="821" font-size="23" fill="#142d42" font-weight="700" text-anchor="start" >Состояние выключателей</text>
<text x="655" y="821" font-size="23" fill="#142d42" font-weight="700" text-anchor="middle" >Iобщ</text>
<text x="858" y="821" font-size="23" fill="#142d42" font-weight="700" text-anchor="middle" >I1</text>
<text x="1060" y="821" font-size="23" fill="#142d42" font-weight="700" text-anchor="middle" >I2</text>
<path d="M72 843 H1128" fill="none" stroke="#cbd7e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="72" y="883" font-size="23" fill="#142d42" font-weight="400" text-anchor="start" >S0, S1, S2 замкнуты</text>
<text x="655" y="883" font-size="23" fill="#14756b" font-weight="700" text-anchor="middle" >2 мА</text>
<text x="858" y="883" font-size="23" fill="#14756b" font-weight="700" text-anchor="middle" >1 мА</text>
<text x="1060" y="883" font-size="23" fill="#14756b" font-weight="700" text-anchor="middle" >1 мА</text>
<text x="72" y="938" font-size="23" fill="#142d42" font-weight="400" text-anchor="start" >Только S2 разомкнут</text>
<text x="655" y="938" font-size="23" fill="#14756b" font-weight="700" text-anchor="middle" >1,5 мА</text>
<text x="858" y="938" font-size="23" fill="#14756b" font-weight="700" text-anchor="middle" >1,5 мА</text>
