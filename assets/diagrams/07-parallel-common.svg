<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">Общий участок и две параллельные ветви</title>
<desc id="desc">Бумажная принципиальная модель с идеальными 3 В постоянного тока. Общий выключатель S0 и резистор R0 1 кОм стоят перед узлом P. Между P и M две ветви: S1 с R1 1 кОм и S2 с R2 1 кОм. Все выключатели изображены замкнутыми. Ток общей части разделяется на токи ветвей и снова складывается в обратном участке. При обеих замкнутых ветвях I общий 2 мА, I1 и I2 по 1 мА, напряжение P–M 1 В. При размыкании S2 ток I1 становится 1,5 мА, I2 равен нулю. При размыкании общего S0 все токи равны нулю. Это расчёт на бумаге, исходный стенд не перестраивают.</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11 Z" fill="#14756b"/></marker></defs>
