<text x="48" y="98" font-size="34" fill="#142d42" font-weight="700" text-anchor="start" >До ветвления ток общий</text>
<text x="48" y="139" font-size="21" fill="#536476" font-weight="400" text-anchor="start" >Бумажная модель: 3 В DC; R0 = R1 = R2 = 1 кОм. Провода идеальные.</text>
