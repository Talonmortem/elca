<text x="48" y="1066" font-size="22" fill="#142d42" font-weight="700" text-anchor="start" >Обе ветви замкнуты: R1 ∥ R2 = 500 Ом; U(P–M) = 1 В.</text>
<text x="48" y="1100" font-size="20" fill="#536476" font-weight="400" text-anchor="start" >Только расчёт на бумаге. Исходный стенд главы 04 не перестраивают.</text>
