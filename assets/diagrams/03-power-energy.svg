<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="978" viewBox="0 0 1280 978" role="img" aria-labelledby="title desc">
  <title id="title">Мощность во времени и одинаковая энергия двух нагрузок</title>
  <desc id="desc">Два графика с одинаковыми осями: горизонтальная от 0 до 1 часа, вертикальная от 0 до 2 киловатт. На графике A мощность 2 кВт действует в течение 0,25 часа, затем мощность нулевая; энергия 0,50 кВт·ч. На графике Б мощность 0,5 кВт действует 1 час; энергия тоже 0,50 кВт·ч. Закрашенные прямоугольники имеют одинаковую площадь и точный одинаковый масштаб. Это учебные профили мощности.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#245c82"/></marker>
    <marker id="current" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#14756b"/></marker>
  </defs>
  <rect width="1280" height="978" fill="white"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
