    <text x="58" y="106" font-size="32" fill="#142d42" font-weight="700" text-anchor="start">Разная мощность — одинаковая энергия</text>
    <text x="58" y="145" font-size="20" fill="#536476" font-weight="400" text-anchor="start">Энергия за интервал времени равна площади под графиком мощности.</text>
