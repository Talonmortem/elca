    <text x="85" y="799" font-size="23" fill="white" font-weight="700" text-anchor="start">У графиков одинаковый масштаб по обеим осям.</text>
    <text x="85" y="838" font-size="23" fill="white" font-weight="400" text-anchor="start">Закрашенные площади равны: в каждом случае расход — 0,50 кВт·ч.</text>
    <text x="58" y="907" font-size="20" fill="#536476" font-weight="400" text-anchor="start">При переменной мощности складывают энергию отдельных интервалов.</text>
    <text x="58" y="941" font-size="19" fill="#536476" font-weight="400" text-anchor="start">Это заданные учебные профили; фактическую работу прибора они не описывают.</text>
