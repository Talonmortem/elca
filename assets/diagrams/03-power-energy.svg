    <text x="86" y="266" font-size="19" fill="#536476" font-weight="400" text-anchor="start">Затем мощность равна нулю.</text>
    <text x="86" y="307" font-size="19" fill="#245c82" font-weight="700" text-anchor="start">P, кВт</text>
