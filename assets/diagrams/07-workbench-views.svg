<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1615" viewBox="0 0 1200 1615" role="img" aria-labelledby="title desc">
<title id="title">Один батарейный стенд в трёх представлениях</title>
<desc id="desc">Три представления одного объекта из главы 04. Принципиальная схема: источник B1 из двух AA, S1 разомкнут, постоянный R0 1 кОм, выход P, резистор R1 1 кОм между P и M, возврат M к минусу. Граница закрытого модуля содержит B1, S1 и R0. Монтажная схема показывает P в отверстии a2, M в a8, выводы R1 в e2 и e8; половины рядов a–e и f–j раздельны. Учебное однолинейное представление сворачивает проводники P и M в одну линию между модулем и нагрузкой, но не изменяет электрические соединения. Для перерисовки обе AA вынуты, модуль не вскрывают.</desc>
