<text x="647" y="1358" font-size="22" fill="#142d42" font-weight="700" text-anchor="middle" >2 проводника:</text>
<text x="647" y="1435" font-size="23" fill="#14756b" font-weight="700" text-anchor="middle" >P и M</text>
<rect x="855" y="1330" width="250" height="130" rx="12" fill="#ffffff" stroke="#dce5ed" stroke-width="2" />
<text x="980" y="1380" font-size="24" fill="#142d42" font-weight="700" text-anchor="middle" >R1 = 1 кОм</text>
<text x="980" y="1420" font-size="22" fill="#536476" font-weight="400" text-anchor="middle" >между P и M</text>
<text x="72" y="1511" font-size="21" fill="#536476" font-weight="400" text-anchor="start" >Одна линия обозначает связь из двух проводников; это не монтажная схема.</text>
<text x="48" y="1588" font-size="20" fill="#536476" font-weight="400" text-anchor="start" >S1 условно в плюсе: штатный монтаж не меняют. M не означает N или PE.</text>
</g>
</svg>
