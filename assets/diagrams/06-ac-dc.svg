<text x="410" y="1019" font-size="21" fill="#14756b" font-weight="700" text-anchor="middle">T = 20 мс = 0,02 с; f = 1/T = 50 Гц</text>
<text x="48" y="1091" font-size="23" fill="#142d42" font-weight="700" text-anchor="start">Знак меняется через каждые 10 мс; полный рисунок повторяется через 20 мс.</text>
<text x="48" y="1128" font-size="21" fill="#536476" font-weight="400" text-anchor="start">Для этой синусоиды: Uпик = 230 × √2 ≈ 325 В. Среднее u за период равно нулю.</text>
<text x="48" y="1163" font-size="20" fill="#536476" font-weight="400" text-anchor="start">Пунктир RMS не изображает постоянный сигнал. Реальное сетевое напряжение может быть искажено.</text>
