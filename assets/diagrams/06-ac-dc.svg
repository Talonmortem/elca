<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1190" viewBox="0 0 1280 1190" role="img" aria-labelledby="title desc">
<title id="title">Постоянное и переменное напряжение: значение, форма и время</title>
<desc id="desc">Два графика с разными вертикальными шкалами. Вверху идеализированное постоянное напряжение 3 В. Внизу идеальная синусоида напряжения L–N с частотой 50 Гц, периодом 20 мс и действующим значением 230 В. Амплитуда равна 230 умножить на квадратный корень из двух, примерно 325 В. Горизонтальная пунктирная линия 230 В — только ориентир действующего значения; это не второй сигнал. Показаны два периода за 40 мс.</desc>
