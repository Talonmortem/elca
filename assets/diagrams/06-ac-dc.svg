<text x="48" y="104" font-size="33" fill="#142d42" font-weight="700" text-anchor="start">AC и DC: что меняется со временем</text>
<text x="48" y="145" font-size="21" fill="#536476" font-weight="400" text-anchor="start">u(t) — мгновенное напряжение. Величина и знак относятся к выбранной паре точек.</text>
