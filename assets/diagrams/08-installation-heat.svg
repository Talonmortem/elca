<text x="890" y="536" font-size="18" fill="#192b3f" text-anchor="middle">Соседние нагруженные кабели греют друг друга.</text>
<text x="890" y="569" font-size="22" fill="#192b3f" text-anchor="middle">Теплоизоляция затрудняет отвод тепла.</text>
<rect x="35" y="619" width="1130" height="133" rx="14" fill="#edf4fb"/>
<text x="58" y="657" font-size="24" fill="#192b3f" font-weight="bold">Для сравниваемой линии заданы одинаковые материал, сечение и ток.</text>
<text x="58" y="695" font-size="22" fill="#192b3f">Температура зависит и от того, сколько тепла выделяется, и от того, как оно отводится.</text>
<text x="58" y="730" font-size="21" fill="#506177">Допустимый ток берут для конкретного кабеля и условий; коэффициент «на глаз» не назначают.</text>
