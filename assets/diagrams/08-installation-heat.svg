<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Способ прокладки меняет отвод тепла</title><desc id="desc">Два условных поперечных разреза. Один кабель отдаёт тепло окружающему воздуху, группа кабелей находится в трубе внутри теплоизоляции. Условия сравниваются качественно, без назначения допустимых токов.</desc>
<rect width="1200" height="790" fill="white"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563a6"/></marker><marker id="heat" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#c47a32"/></marker><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#f3e9d9"/><path d="M0 0 V16" stroke="#decdb5" stroke-width="4"/></pattern></defs>
<g font-family="DejaVu Sans, sans-serif">
<text x="40" y="57" font-size="38" fill="#192b3f" font-weight="bold">Одинаковое сечение — разные условия</text>
<text x="40" y="96" font-size="22" fill="#506177">Сравнение факторов, не монтажный проект. Все размеры и слои условны.</text>
