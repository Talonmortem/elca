<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1020" viewBox="0 0 1280 1020" role="img" aria-labelledby="title desc">
  <title id="title">Как выбрать вид учебной практики</title>
  <desc id="desc">Функциональная схема выбора, а не разрешение на электромонтаж. При повреждении, запахе гари, дыме, искрении или угрозе человеку нужно остановиться и обратиться за помощью. Если задача ограничена внешней маркировкой доступного целого корпуса, документами или учебным фото, можно наблюдать без разборки. Практика на отдельном маломощном батарейном стенде с ограничением тока начинается по полной инструкции главы 04. Доступ к проводникам действующей установки, неизвестное питание и неясные условия требуют остановки и разбора задачи со специалистом.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#536476"/>
    </marker>
  </defs>
  <rect width="1280" height="1020" rx="24" fill="#f4f7fa"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="58" y="57" fill="#14756b" font-size="18" font-weight="700" letter-spacing="1.7">ГЛАВА 01 · ФУНКЦИОНАЛЬНАЯ СХЕМА</text>
    <text x="58" y="109" fill="#142d42" font-size="34" font-weight="700">Как выбрать вид учебной практики</text>
    <text x="58" y="145" fill="#536476" font-size="20">Иди сверху вниз. Если условия неясны — остановись и уточни их.</text>

    <!-- Questions: a “yes” leaves the decision path; a “no” continues down. -->
    <g fill="#ffffff" stroke="#dce5ed" stroke-width="2">
      <rect x="58" y="182" width="650" height="146" rx="16"/>
      <rect x="58" y="380" width="650" height="146" rx="16"/>
      <rect x="58" y="578" width="650" height="146" rx="16"/>
    </g>
    <g stroke="#536476" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M708 255 H804"/>
      <path d="M708 453 H804"/>
      <path d="M708 651 H804"/>
      <path d="M383 328 V371"/>
      <path d="M383 526 V569"/>
      <path d="M383 724 V769"/>
    </g>
    <g fill="#536476" font-size="18" font-weight="700">
      <text x="744" y="240">ДА</text>
      <text x="744" y="438">ДА</text>
      <text x="744" y="636">ДА</text>
      <text x="405" y="359">НЕТ</text>
      <text x="405" y="557">НЕТ</text>
      <text x="405" y="757">НЕТ</text>
    </g>

    <text x="84" y="218" fill="#ad342e" font-size="17" font-weight="700" letter-spacing="1">1 · ЕСТЬ ПРИЗНАКИ ОПАСНОСТИ?</text>
    <text x="84" y="258" fill="#142d42" font-size="23">Повреждение или запах гари,</text>
    <text x="84" y="292" fill="#142d42" font-size="23">дым, искрение, угроза человеку?</text>

    <rect x="816" y="182" width="406" height="146" rx="16" fill="#fcebe8" stroke="#efc6bf" stroke-width="2"/>
    <text x="842" y="218" fill="#96332c" font-size="21" font-weight="700">Прекратить использование</text>
    <text x="842" y="252" fill="#6d3d37" font-size="18">Не трогать. Безопасная дистанция.</text>
    <text x="842" y="279" fill="#6d3d37" font-size="18">Проверка — со специалистом.</text>
    <text x="842" y="306" fill="#96332c" font-size="18" font-weight="700">Дым, огонь, угроза жизни — 112.</text>

    <text x="84" y="416" fill="#14756b" font-size="17" font-weight="700" letter-spacing="1">2 · ДОСТАТОЧНО НАБЛЮДЕНИЯ?</text>
    <text x="84" y="453" fill="#142d42" font-size="22">Только внешняя маркировка,</text>
    <text x="84" y="485" fill="#142d42" font-size="22">инструкция или учебное фото?</text>
    <text x="84" y="511" fill="#536476" font-size="17">Корпус цел, доступ свободный, разборка не нужна.</text>

    <rect x="816" y="380" width="406" height="146" rx="16" fill="#e0f2ed" stroke="#badcd3" stroke-width="2"/>
    <text x="842" y="416" fill="#11695f" font-size="23" font-weight="700">Наблюдение</text>
    <text x="842" y="452" fill="#244d48" font-size="19">Можно в этой главе.</text>
    <text x="842" y="482" fill="#244d48" font-size="18">Без разборки и измерений.</text>
    <text x="842" y="509" fill="#244d48" font-size="18">Без проверки «на ощупь».</text>

    <text x="84" y="614" fill="#28638a" font-size="17" font-weight="700" letter-spacing="1">3 · ЕСТЬ УСЛОВИЯ УЧЕБНОГО ОПЫТА?</text>
    <text x="84" y="651" fill="#142d42" font-size="22">Отдельный маломощный батарейный стенд,</text>
    <text x="84" y="683" fill="#142d42" font-size="22">ограничение тока и полная инструкция?</text>
    <text x="84" y="709" fill="#536476" font-size="17">Подготовка и проверка условий — по главе 04.</text>

    <rect x="816" y="578" width="406" height="146" rx="16" fill="#e6eff8" stroke="#bfd4e7" stroke-width="2"/>
    <text x="842" y="614" fill="#245c82" font-size="23" font-weight="700">Учебный стол</text>
    <text x="842" y="650" fill="#35586f" font-size="19">Начиная с главы 04.</text>
    <text x="842" y="680" fill="#35586f" font-size="18">Нет соединения с розеткой</text>
    <text x="842" y="707" fill="#35586f" font-size="18">или квартирной проводкой.</text>

    <rect x="58" y="780" width="1164" height="144" rx="16" fill="#142d42"/>
    <text x="84" y="817" fill="#ffffff" font-size="23" font-weight="700">Сначала разбор задачи со специалистом</text>
    <text x="84" y="856" fill="#e0e9f1" font-size="21">Нужен доступ к проводникам действующей установки, неизвестен источник</text>
    <text x="84" y="889" fill="#e0e9f1" font-size="21">питания или не выполнены условия опыта? Не переходи к действию.</text>

    <text x="58" y="968" fill="#536476" font-size="19">Это выбор формата обучения. Схема не подтверждает безопасность установки</text>
    <text x="58" y="995" fill="#536476" font-size="19">и не является допуском к электромонтажу.</text>
  </g>
</svg>
