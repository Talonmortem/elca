<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Разная мощность и одинаковый расход энергии</title>
  <desc id="desc">Сравнение двух учебных нагрузок с постоянной мощностью. Первая: 10 Вт в течение 10 часов, энергия 100 ватт-часов, или 0,1 киловатт-часа. Вторая: 100 Вт в течение 1 часа, энергия тоже 100 ватт-часов, или 0,1 киловатт-часа. Вторая нагрузка мощнее в 10 раз, но работает в 10 раз меньше. Мощность показывает скорость преобразования энергии, а энергия — итог за выбранное время. Это расчёт, а не электрическая схема или измерение реальных приборов.</desc>
  <rect width="1200" height="820" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="48" y="51" font-size="18" font-weight="700" fill="#14756b">ВВОДНАЯ ГЛАВА A1 · МОЩНОСТЬ И ЭНЕРГИЯ</text>
    <text x="48" y="104" font-size="36" font-weight="700" fill="#142d42">Мощность × время = энергия</text>
    <text x="48" y="145" font-size="21" fill="#536476">Мощность — темп. Энергия — накопленный итог за выбранное время.</text>

    <rect x="48" y="183" width="540" height="333" rx="16" fill="#eef4fb" stroke="#c5d8ed" stroke-width="2"/>
    <text x="72" y="227" font-size="24" font-weight="700" fill="#142d42">Меньше мощность, дольше работа</text>
    <text x="72" y="307" font-size="48" font-weight="700" fill="#245c82">10 Вт</text>
    <text x="280" y="306" font-size="36" fill="#536476">×</text>
    <text x="359" y="307" font-size="48" font-weight="700" fill="#245c82">10 ч</text>
    <text x="72" y="344" font-size="21" fill="#536476">мощность</text>
    <text x="359" y="344" font-size="21" fill="#536476">время</text>
    <text x="72" y="404" font-size="27" font-weight="700" fill="#142d42">10 Вт × 10 ч = 100 Вт·ч</text>
    <rect x="72" y="432" width="492" height="60" rx="10" fill="#ffffff" stroke="#b9dcd2" stroke-width="2"/>
    <text x="318" y="474" text-anchor="middle" font-size="32" font-weight="700" fill="#14756b">0,1 кВт·ч</text>

    <rect x="612" y="183" width="540" height="333" rx="16" fill="#f5f0fb" stroke="#d9c9eb" stroke-width="2"/>
    <text x="636" y="227" font-size="24" font-weight="700" fill="#142d42">Больше мощность, короче работа</text>
    <text x="636" y="307" font-size="48" font-weight="700" fill="#715095">100 Вт</text>
    <text x="884" y="306" font-size="36" fill="#536476">×</text>
    <text x="973" y="307" font-size="48" font-weight="700" fill="#715095">1 ч</text>
    <text x="636" y="344" font-size="21" fill="#536476">мощность</text>
    <text x="973" y="344" font-size="21" fill="#536476">время</text>
    <text x="636" y="404" font-size="27" font-weight="700" fill="#142d42">100 Вт × 1 ч = 100 Вт·ч</text>
    <rect x="636" y="432" width="492" height="60" rx="10" fill="#ffffff" stroke="#b9dcd2" stroke-width="2"/>
    <text x="882" y="474" text-anchor="middle" font-size="32" font-weight="700" fill="#14756b">0,1 кВт·ч</text>

    <rect x="48" y="543" width="1104" height="165" rx="16" fill="#edf8f5" stroke="#b9dcd2" stroke-width="2"/>
    <text x="72" y="589" font-size="27" font-weight="700" fill="#11695f">Расход энергии одинаковый: по 0,1 кВт·ч</text>
    <text x="72" y="634" font-size="22" fill="#142d42">Вторая нагрузка мощнее в 10 раз, но работает в 10 раз меньше.</text>
    <text x="72" y="676" font-size="20" fill="#536476">Условие сравнения: мощность каждой нагрузки постоянна всё указанное время.</text>
    <text x="48" y="753" font-size="22" font-weight="700" fill="#142d42">1 кВт = 1000 Вт · 1 кВт·ч = 1000 Вт·ч</text>
    <text x="48" y="792" font-size="19" fill="#536476">Учебный расчёт. Реальные приборы могут менять мощность и выключаться.</text>
  </g>
</svg>
