<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Из чего состоит кабель и что означает сечение</title><desc id="desc">Условный поперечный разрез кабеля с тремя изолированными жилами. Отдельно показаны сплошная круглая и многопроволочная жилы. Это рисунок конструкции, а не схема соединений.</desc>
<rect width="1200" height="760" fill="white"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563a6"/></marker><marker id="heat" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#c47a32"/></marker><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#f3e9d9"/><path d="M0 0 V16" stroke="#decdb5" stroke-width="4"/></pattern></defs>
<g font-family="DejaVu Sans, sans-serif">
<text x="40" y="56" font-size="37" fill="#192b3f" font-weight="bold">Кабель: металл, изоляция, оболочка</text>
<text x="40" y="95" font-size="22" fill="#506177">Условный разрез без масштаба. Цвет здесь не обозначает L, N или PE.</text>
<rect x="35" y="125" width="570" height="510" rx="14" fill="#f6f8fb"/>
<rect x="625" y="125" width="540" height="510" rx="14" fill="#f6f8fb"/>
<text x="62" y="166" font-size="26" fill="#192b3f" font-weight="bold">Три изолированные жилы</text>
<text x="655" y="166" font-size="26" fill="#192b3f" font-weight="bold">Одна жила: две конструкции</text>
<circle cx="288" cy="370" r="155" fill="#4a5565" stroke="#192b3f" stroke-width="3"/>
<circle cx="288" cy="370" r="132" fill="#e7decb"/>
<circle cx="228" cy="320" r="51" fill="#92b6d0" stroke="#192b3f" stroke-width="2"/>
<circle cx="228" cy="320" r="24" fill="#d79149" stroke="#8b542a" stroke-width="2"/>
<circle cx="348" cy="320" r="51" fill="#b6a8d1" stroke="#192b3f" stroke-width="2"/>
<circle cx="348" cy="320" r="24" fill="#d79149" stroke="#8b542a" stroke-width="2"/>
<circle cx="288" cy="427" r="51" fill="#8ebbb5" stroke="#192b3f" stroke-width="2"/>
<circle cx="288" cy="427" r="24" fill="#d79149" stroke="#8b542a" stroke-width="2"/>
<path d="M228 320 L155 234 L73 234" stroke="#506177" stroke-width="2" fill="none"/>
<text x="70" y="221" font-size="20" fill="#192b3f">Металл жилы</text>
<path d="M384 285 L434 234 L555 234" stroke="#506177" stroke-width="2" fill="none"/>
<text x="405" y="221" font-size="20" fill="#192b3f">Изоляция</text>
<path d="M172 472 L115 548 L71 548" stroke="#506177" stroke-width="2" fill="none"/>
<text x="70" y="579" font-size="21" fill="#192b3f">Общая оболочка</text>
<path d="M375 428 L463 520 L549 520" stroke="#506177" stroke-width="2" fill="none"/>
<text x="410" y="549" font-size="20" fill="#192b3f">Заполнитель</text>
<text x="64" y="614" font-size="19" fill="#506177">Площадь оболочки не входит в сечение жилы.</text>
<circle cx="760" cy="292" r="61" fill="#d79149" stroke="#8b542a" stroke-width="3"/>
<line x1="700" y1="292" x2="820" y2="292" stroke="#2563a6" stroke-width="2"/>
<path d="M700 282 V302 M820 282 V302" stroke="#2563a6" stroke-width="2" fill="none"/>
<text x="760" y="278" font-size="25" fill="#2563a6" font-weight="bold" text-anchor="middle">d</text>
<text x="760" y="386" font-size="21" fill="#192b3f" text-anchor="middle">Сплошная круглая</text>
<circle cx="1022" cy="292" r="18" fill="#d79149" stroke="#8b542a" stroke-width="2"/>
<circle cx="1060.0" cy="292.0" r="18" fill="#d79149" stroke="#8b542a" stroke-width="2"/>
<circle cx="1041.0" cy="324.91" r="18" fill="#d79149" stroke="#8b542a" stroke-width="2"/>
<circle cx="1003.0" cy="324.91" r="18" fill="#d79149" stroke="#8b542a" stroke-width="2"/>
<circle cx="984.0" cy="292.0" r="18" fill="#d79149" stroke="#8b542a" stroke-width="2"/>
<circle cx="1003.0" cy="259.09" r="18" fill="#d79149" stroke="#8b542a" stroke-width="2"/>
<circle cx="1041.0" cy="259.09" r="18" fill="#d79149" stroke="#8b542a" stroke-width="2"/>
<text x="1022" y="386" font-size="21" fill="#192b3f" text-anchor="middle">Многопроволочная</text>
<text x="656" y="447" font-size="24" fill="#192b3f">d — диаметр металла, мм</text>
<text x="656" y="487" font-size="24" fill="#192b3f">S — площадь металла, мм²</text>
<text x="656" y="536" font-size="31" fill="#2563a6" font-weight="bold">S = πd² / 4</text>
<text x="656" y="572" font-size="19" fill="#506177">Только для сплошного круглого сечения.</text>
<text x="656" y="609" font-size="19" fill="#506177">У пучка складывают площади проволок.</text>
<rect x="35" y="658" width="1130" height="70" rx="14" fill="#edf4fb"/>
<text x="58" y="688" font-size="23" fill="#192b3f" font-weight="bold">Не путай число жил кабеля с числом проволок внутри одной жилы.</text>
<text x="58" y="715" font-size="20" fill="#506177">Пустоты между проволоками и изоляция не являются металлом проводника.</text>
</g></svg>
