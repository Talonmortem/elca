<text x="204" y="416" font-size="22" fill="#142d42" font-weight="400" text-anchor="middle">S1 замкнут</text>
<text x="204" y="454" font-size="22" fill="#142d42" font-weight="400" text-anchor="middle">для наблюдения</text>
<text x="204" y="492" font-size="22" fill="#142d42" font-weight="400" text-anchor="middle">R0 = 1 кОм</text>
<text x="204" y="558" font-size="20" fill="#14756b" font-weight="700" text-anchor="middle">R0 внутри корпуса</text>
