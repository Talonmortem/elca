<text x="706" y="722" font-size="23" fill="#245c82" font-weight="700" text-anchor="start">Катод K → e8</text>
<text x="706" y="767" font-size="19" fill="#536476" font-weight="400" text-anchor="start">Внешний вид LED показан условно.</text>
<rect x="48" y="840" width="1104" height="151" rx="16" fill="#edf8f5" stroke="#b9dcd2" stroke-width="2" />
<text x="72" y="879" font-size="23" fill="#142d42" font-weight="700" text-anchor="start">Условная оценка, а не измерение</text>
<text x="72" y="922" font-size="23" fill="#14756b" font-weight="700" text-anchor="start">При U_B = 3,0 В и U_F = 1,8 В: I ≈ (3 − 1,8) / 1000 = 1,2 мА.</text>
<text x="72" y="963" font-size="21" fill="#536476" font-weight="400" text-anchor="start">Яркость зависит от выбранного LED, состояния батареек и освещения.</text>
<rect x="48" y="1015" width="1104" height="132" rx="16" fill="#fff7ed" stroke="#e6ceaa" stroke-width="2" />
<text x="72" y="1054" font-size="23" fill="#9b5d15" font-weight="700" text-anchor="start">Перед заменой R1 на VD1: S1 = OFF и обе AA вынуты.</text>
<text x="72" y="1091" font-size="21" fill="#142d42" font-weight="400" text-anchor="start">R0 остаётся в закрытой части. Не замыкать выводы для «проверки».</text>
<text x="72" y="1125" font-size="21" fill="#536476" font-weight="400" text-anchor="start">Свечение не подтверждает исправность всех соединений стенда.</text>
