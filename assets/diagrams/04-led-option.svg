<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
<title id="title">Необязательный опыт со светодиодом вместо резистора нагрузки</title>
<desc id="desc">Слева принципиальная схема: выход P неизменного батарейного модуля с двумя AA, штатным выключателем S1 и постоянным резистором R0 1 кОм соединён с анодом A красного малоточного светодиода VD1, катод K соединён с M. На символе светодиода две стрелки направлены наружу. Резистор R1 снят, R0 остаётся у источника. Справа монтаж левой половины макетной платы: P в a2, M в a8, анод светодиода в e2, катод в e8. Боковые шины не используются; полярность выводов определяется по паспорту выбранного светодиода. При условных 3 В на батарее и прямом падении 1,8 В оценка тока составляет 1,2 мА, это не измерение и не обещание заданной яркости. Замена выполняется при выключенном S1 и вынутых обеих батарейках.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#14756b"/></marker></defs>
