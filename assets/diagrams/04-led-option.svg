<text x="48" y="104" font-size="34" fill="#142d42" font-weight="700" text-anchor="start">Светодиод ставится вместо R1</text>
<text x="48" y="146" font-size="20" fill="#536476" font-weight="400" text-anchor="start">Модуль питания остаётся прежним. Постоянный ограничитель R0 нельзя снимать.</text>
