<text x="510" y="979" font-size="23" fill="#245c82" font-weight="700" text-anchor="start">N</text>
<text x="510" y="1032" font-size="23" fill="#14756b" font-weight="700" text-anchor="start">PE</text>
<text x="210" y="1130" font-size="18" fill="#536476" font-weight="400" text-anchor="start">Заземление нейтрали источника</text>
<text x="76" y="1177" font-size="21" fill="#142d42" font-weight="700" text-anchor="start">N возвращает рабочий ток. PE связывает корпус с заземлённой нейтралью источника.</text>
<text x="76" y="1213" font-size="19" fill="#536476" font-weight="400" text-anchor="start">Связь N–PE находится у источника; дополнительной перемычки у нагрузки нет.</text>
<rect x="48" y="1262" width="1184" height="512" rx="14" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2"/>
<text x="76" y="1304" font-size="29" fill="#14756b" font-weight="700" text-anchor="start">TN-C-S</text>
<text x="269" y="1304" font-size="23" fill="#142d42" font-weight="700" text-anchor="start">Сначала PEN, затем отдельные N и PE</text>
<rect x="891" y="1350" width="290" height="275" rx="0" fill="white" stroke="#879aa9" stroke-width="4"/>
<text x="1036" y="1378" font-size="19" fill="#536476" font-weight="400" text-anchor="middle">Корпус</text>
<path d="M891 1384 V1400 M891 1524 V1540" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
