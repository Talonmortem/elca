<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2540" viewBox="0 0 1280 2540" role="img" aria-labelledby="title desc">
<title id="title">Чем отличаются TN-C, TN-S, TN-C-S и TT</title>
<desc id="desc">Четыре функциональные схемы однофазных фрагментов систем с источником 230 В переменного тока 50 Гц и заземлённой нейтралью. В TN-C рабочая и защитная функции объединены в PEN. В TN-S N и PE раздельны от источника. В TN-C-S PEN разделяется в одной проектной точке на N и PE; после неё повторное объединение не показано и недопустимо. В TT N подключён к нагрузке, а корпус отдельным PE соединён с местным заземлителем. Возврат через грунт имеет конечное сопротивление и не изображён металлической перемычкой. Остальные фазы и аппараты защиты опущены; схема не задаёт выбор или переделку квартирной установки.</desc>
