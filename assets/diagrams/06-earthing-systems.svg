<path d="M765 2149 v20 M740 2169 h50 M748 2180 h34 M757 2191 h16" fill="none" stroke="#14756b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="510" y="2055" font-size="23" fill="#245c82" font-weight="700" text-anchor="start">N</text>
<text x="814" y="2108" font-size="23" fill="#14756b" font-weight="700" text-anchor="start">PE</text>
<text x="180" y="2221" font-size="18" fill="#536476" font-weight="400" text-anchor="middle">Источник</text>
<text x="765" y="2221" font-size="18" fill="#14756b" font-weight="400" text-anchor="middle">Установка</text>
<path d="M180 2205 C270 2184,365 2225,450 2205 S650 2184,765 2205" fill="none" stroke="#956638" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 9"/>
<text x="465" y="2185" font-size="18" fill="#956638" font-weight="400" text-anchor="middle">Грунт: конечное сопротивление</text>
<text x="76" y="2253" font-size="21" fill="#142d42" font-weight="700" text-anchor="start">PE корпуса не соединён с N: путь повреждения включает местный заземлитель и грунт.</text>
<text x="76" y="2289" font-size="19" fill="#536476" font-weight="400" text-anchor="start">Согласование заземлителя и УДТ (УЗО) проверяют отдельно; PE и УЗО не заменяют друг друга.</text>
<text x="48" y="2355" font-size="19" fill="#536476" font-weight="400" text-anchor="start">Точки — электрические соединения. Пересечение границы корпуса проводом не означает связь с корпусом.</text>
<text x="48" y="2392" font-size="19" fill="#536476" font-weight="400" text-anchor="start">Цвет линии помогает читать эту иллюстрацию; фактическую роль провода по одному цвету не устанавливают.</text>
<text x="48" y="2430" font-size="20" fill="#536476" font-weight="400" text-anchor="start">Аппараты защиты, повторные заземления и уравнивание потенциалов здесь не детализированы.</text>
<text x="48" y="2470" font-size="22" fill="#142d42" font-weight="700" text-anchor="start">Это объяснение принципов, а не монтажный проект</text>
<text x="48" y="2503" font-size="22" fill="#142d42" font-weight="700" text-anchor="start">и не способ определить систему своей квартиры.</text>
</g>
</svg>
