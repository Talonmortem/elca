<marker id="arr-wire" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#245c82"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#14756b"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b33636"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b46a19"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#536476"/></marker>
</defs>
<rect width="1280" height="2540" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="48" y="50" font-size="18" fill="#14756b" font-weight="700" text-anchor="start">ГЛАВА 06 · ФУНКЦИОНАЛЬНЫЕ СХЕМЫ</text>
<text x="48" y="104" font-size="33" fill="#142d42" font-weight="700" text-anchor="start">Системы заземления: различие связей</text>
<text x="48" y="145" font-size="21" fill="#536476" font-weight="400" text-anchor="start">Показаны однофазные фрагменты: источник 230 В ~, 50 Гц. Остальные фазы и аппараты опущены.</text>
