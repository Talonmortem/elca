<circle cx="891" cy="1584" r="6" fill="#14756b" stroke="none" stroke-width="3"/>
<text x="400" y="1517" font-size="23" fill="#14756b" font-weight="700" text-anchor="start">PEN</text>
<text x="790" y="1517" font-size="23" fill="#245c82" font-weight="700" text-anchor="start">N</text>
<text x="790" y="1570" font-size="23" fill="#14756b" font-weight="700" text-anchor="start">PE</text>
<text x="620" y="1453" font-size="19" fill="#14756b" font-weight="700" text-anchor="middle">Проектная точка разделения PEN</text>
<text x="210" y="1668" font-size="18" fill="#536476" font-weight="400" text-anchor="start">Заземление нейтрали источника</text>
<text x="76" y="1715" font-size="21" fill="#142d42" font-weight="700" text-anchor="start">После проектного разделения N и PE ведут отдельно и снова не объединяют.</text>
<text x="76" y="1751" font-size="19" fill="#536476" font-weight="400" text-anchor="start">Точка разделения и требования к PEN задаются проектом; такая схема не описывает переделку розетки.</text>
<rect x="48" y="1800" width="1184" height="512" rx="14" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2"/>
