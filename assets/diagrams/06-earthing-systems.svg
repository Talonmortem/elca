<text x="510" y="441" font-size="23" fill="#14756b" font-weight="700" text-anchor="start">PEN</text>
<text x="510" y="486" font-size="19" fill="#536476" font-weight="400" text-anchor="middle">Общая рабочая и защитная функция</text>
<text x="210" y="592" font-size="18" fill="#536476" font-weight="400" text-anchor="start">Заземление нейтрали источника</text>
<text x="76" y="639" font-size="21" fill="#142d42" font-weight="700" text-anchor="start">PEN одновременно участвует в питании и защите; отдельного PE на этом участке нет.</text>
<text x="76" y="675" font-size="19" fill="#536476" font-weight="400" text-anchor="start">Это обозначение системы, не разрешение делать перемычку между N и корпусом в розетке.</text>
