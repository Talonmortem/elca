<circle cx="180" cy="924.0" r="30" fill="white" stroke="#245c82" stroke-width="3"/>
<text x="180" y="934.0" font-size="36" fill="#245c82" font-weight="400" text-anchor="middle">~</text>
<text x="84" y="910.0" font-size="19" fill="#536476" font-weight="400" text-anchor="start">230 В</text>
<text x="84" y="941.0" font-size="18" fill="#536476" font-weight="400" text-anchor="start">50 Гц</text>
