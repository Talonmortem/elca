<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc">
<title id="title">Омметр измеряет все пути между подключёнными щупами</title>
<desc id="desc">Две принципиальные схемы без внешнего питания. Слева мультиметр в режиме сопротивления соединён только с отдельным снятым R1 1 кОм; показание около 1 кОм. Справа R1 1 кОм и R2 1 кОм соединены параллельно между щупами; прибор показывает около 500 Ом. Исправный R1 сохранил своё сопротивление: измерено эквивалентное сопротивление двух ветвей. Для отдельной проверки R1 отключают от остальной цепи хотя бы один его вывод. Тестовый ток создаёт сам мультиметр; батареи, USB и иные внешние источники отсутствуют.</desc>
<rect width="1200" height="1070" fill="#ffffff"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="48" y="51" font-size="19" fill="#14756b" font-weight="700" text-anchor="start">ГЛАВА 05 · ПРИНЦИПИАЛЬНЫЕ СХЕМЫ БЕЗ ВНЕШНЕГО ПИТАНИЯ</text>
<text x="48" y="104" font-size="34" fill="#142d42" font-weight="700" text-anchor="start">Омметр видит все соединённые пути</text>
<text x="48" y="146" font-size="21" fill="#536476" font-weight="400" text-anchor="start">В режиме Ω небольшой тестовый ток создаёт сам прибор. Внешний источник отключён.</text>
<rect x="48" y="190" width="530" height="560" rx="16" fill="#f7f9fb" stroke="#dce5ed" stroke-width="2"/>
<rect x="602" y="190" width="550" height="560" rx="16" fill="#edf8f5" stroke="#b9dcd2" stroke-width="2"/>
<text x="76" y="232" font-size="27" fill="#142d42" font-weight="700" text-anchor="start">1 · Отдельный R1</text>
<text x="76" y="269" font-size="21" fill="#536476" font-weight="400" text-anchor="start">Оба вывода свободны от схемы.</text>
<text x="630" y="232" font-size="25" fill="#142d42" font-weight="700" text-anchor="start">2 · Два параллельных пути</text>
<text x="630" y="269" font-size="20" fill="#536476" font-weight="400" text-anchor="start">R2 не отключён от точек измерения.</text>
<path d="M268 350 H160 V545 H253" fill="none" stroke="#b33636" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M352 350 H454 V545 H363" fill="none" stroke="#24313d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="310" cy="350" r="42" fill="#ffffff" stroke="#245c82" stroke-width="4"/>
<text x="310" y="363" font-size="34" fill="#14756b" font-weight="700" text-anchor="middle">Ω</text>
<text x="160" y="329" font-size="20" fill="#b33636" font-weight="700" text-anchor="start">V/Ω</text>
<text x="454" y="329" font-size="20" fill="#24313d" font-weight="700" text-anchor="end">COM</text>
<rect x="253" y="527" width="110" height="36" rx="0" fill="#e0f2ed" stroke="#245c82" stroke-width="4"/>
<text x="308" y="500" font-size="24" fill="#142d42" font-weight="700" text-anchor="middle">R1</text>
<text x="308" y="605" font-size="23" fill="#142d42" font-weight="700" text-anchor="middle">1 кОм</text>
<circle cx="160" cy="545" r="6" fill="#245c82" stroke="none" stroke-width="0"/>
<circle cx="454" cy="545" r="6" fill="#245c82" stroke="none" stroke-width="0"/>
<text x="76" y="680" font-size="28" fill="#14756b" font-weight="700" text-anchor="start">Около 1 кОм</text>
<text x="76" y="720" font-size="21" fill="#142d42" font-weight="400" text-anchor="start">Между щупами — только R1.</text>
<path d="M859 350 H722 V590" fill="none" stroke="#b33636" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M943 350 H1080 V590" fill="none" stroke="#24313d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="901" cy="350" r="42" fill="#ffffff" stroke="#245c82" stroke-width="4"/>
<text x="901" y="363" font-size="34" fill="#14756b" font-weight="700" text-anchor="middle">Ω</text>
<text x="722" y="329" font-size="20" fill="#b33636" font-weight="700" text-anchor="start">V/Ω</text>
<text x="1080" y="329" font-size="20" fill="#24313d" font-weight="700" text-anchor="end">COM</text>
<path d="M722 485 H820 M980 485 H1080 M722 590 H820 M980 590 H1080" fill="none" stroke="#245c82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="820" y="467" width="160" height="36" rx="0" fill="#e0f2ed" stroke="#245c82" stroke-width="4"/>
<rect x="820" y="572" width="160" height="36" rx="0" fill="#e0f2ed" stroke="#245c82" stroke-width="4"/>
<text x="900" y="444" font-size="23" fill="#142d42" font-weight="700" text-anchor="middle">R1 = 1 кОм</text>
<text x="900" y="549" font-size="23" fill="#142d42" font-weight="700" text-anchor="middle">R2 = 1 кОм</text>
<circle cx="722" cy="485" r="6" fill="#245c82" stroke="none" stroke-width="0"/>
<circle cx="722" cy="590" r="6" fill="#245c82" stroke="none" stroke-width="0"/>
<circle cx="1080" cy="485" r="6" fill="#245c82" stroke="none" stroke-width="0"/>
<circle cx="1080" cy="590" r="6" fill="#245c82" stroke="none" stroke-width="0"/>
<text x="630" y="680" font-size="28" fill="#14756b" font-weight="700" text-anchor="start">Около 500 Ом</text>
<text x="630" y="720" font-size="21" fill="#142d42" font-weight="400" text-anchor="start">Оба пути входят в измерение.</text>
<rect x="48" y="780" width="1104" height="136" rx="16" fill="#edf8f5" stroke="#b9dcd2" stroke-width="2"/>
<text x="76" y="826" font-size="28" fill="#14756b" font-weight="700" text-anchor="start">R_показ = (R1 × R2) / (R1 + R2) = 500 Ом</text>
<text x="76" y="873" font-size="23" fill="#142d42" font-weight="400" text-anchor="start">R1 по-прежнему 1 кОм: изменилось подключение измерителя.</text>
<text x="48" y="958" font-size="21" fill="#142d42" font-weight="700" text-anchor="start">Чтобы проверить R1 отдельно, отключи от остальной цепи хотя бы один его вывод.</text>
<text x="48" y="998" font-size="21" fill="#536476" font-weight="400" text-anchor="start">Все перестановки выполняются без батарей, USB и иных внешних источников.</text>
<text x="48" y="1038" font-size="20" fill="#536476" font-weight="400" text-anchor="start">Схемы показывают соединения, а не расположение деталей на макетной плате.</text>
</g>
</svg>
